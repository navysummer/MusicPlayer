[package]
name = "music-player"
version = "0.0.1"
description = "A beautiful ancient-Chinese-style music player powered by Tauri"
edition = "2021"

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tiny_http = "0.12"
anyhow = "1"
log = "0.4"
env_logger = "0.11"
lofty = { version = "0.22", features = ["id3v2_compression_support"] }
base64 = "0.22"
uuid = { version = "1", features = ["v4"] }

[lib]
name = "music_player_lib"
crate-type = ["lib", "cdylib", "staticlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
